# GLPI Agent - Configuração para Instalação Detalhada
# ====================================================
# Esta configuração permite ao usuário acompanhar cada passo
# da instalação e configuração do GLPI Agent

#
# *** CONFIGURAÇÃO PRINCIPAL - OBRIGATÓRIA ***
#

# URL do servidor GLPI com plugin via Marketplace
server = https://j2ksistemas.com.br/ativos/marketplace/glpiinventory/

# Tag de identificação para rastreamento
tag = master.sndesk.com.br

#
# *** TIMING CONFIGURADO PARA ACOMPANHAMENTO ***
#

# Delay inicial (15 minutos) - permite preparação e acompanhamento
delaytime = 900
# Executar imediatamente quando solicitado (não aguardar agendamento)
lazy = 0
# Forçar execução mesmo se não solicitado pelo servidor
force = 1

#
# *** CONFIGURAÇÕES DE INVENTÁRIO - VISÍVEIS ***
#

# Usar formato JSON (mais legível nos logs)
json = 1
# TAMBÉM salvar em HTML para visualização local
html = 1
# Timeout generoso para permitir acompanhamento
backend-collect-timeout = 300
# Inventário COMPLETO sempre (usuário vê tudo)
full-inventory-postpone = 0
# Não restringir categorias (inventário completo)
# required-category =

#
# *** CONFIGURAÇÕES DE SISTEMA - DETALHADAS ***
#

# Nome do ativo usando hostname simples (mais claro)
assetname-support = 1
# Tipo de item padrão
itemtype = Computer

#
# *** CONFIGURAÇÕES DE COLETA - COMPLETAS ***
#

# HABILITAR scan de diretórios home (mais dados)
scan-homedirs = 1
# HABILITAR scan de perfis (Windows - mais dados)
scan-profiles = 1
# NÃO excluir nenhuma categoria (inventário completo)
# no-category =
# NÃO desabilitar tarefas (executar todas)
# no-task =

#
# *** CONFIGURAÇÕES DE REDE - DETALHADAS ***
#

# Proxy (configurar se necessário)
proxy =
# Autenticação (configurar se necessário)
user =
password =
# SSL com verificação HABILITADA (segurança)
no-ssl-check = 0
# Timeout maior para conexões lentas
timeout = 180
# Compressão habilitada (padrão)
no-compression = no

#
# *** CONFIGURAÇÕES DO DAEMON - VISÍVEIS ***
#

# Interface web HABILITADA (permite monitoramento)
no-httpd = 0
# Porta padrão para acesso web
httpd-port = 62354
# Escutar em todas as interfaces
httpd-ip =
# Permitir acesso local para monitoramento
httpd-trust = 127.0.0.1,localhost

#
# *** CONFIGURAÇÕES DE LOG - MÁXIMO DETALHE ***
#

# Log COMPLETO: console + arquivo
logger = stderr,file
# Arquivo de log específico
logfile = /var/log/glpi-agent.log
# Tamanho máximo do log (100MB para capturar tudo)
logfile-maxsize = 100
# Facility do syslog
logfacility = LOG_USER
# Cores habilitadas no console
color = 1
# DEBUG NÍVEL MÁXIMO (mostra tudo)
debug = 2

#
# *** CONFIGURAÇÕES AVANÇADAS - MONITORAMENTO ***
#

# NÃO recarregar configuração automaticamente (evita confusão)
conf-reload-interval = 0
# Diretório de dados padrão
# vardir =
# Sem conteúdo adicional inicialmente
additional-content =
# Um worker por vez (mais fácil de acompanhar)
remote-workers = 1
# Mais tentativas SNMP (para garantir descoberta)
snmp-retries = 3

#
# *** CONFIGURAÇÕES DE TASKS - SEQUENCIAL ***
#

# Executar tarefas em ordem específica para acompanhamento
tasks = inventory,netdiscovery,netinventory,remoteinventory,wakeonlan
# Nenhuma task desabilitada (ver tudo funcionando)
# no-task =

#
# *** INCLUDE DE CONFIGURAÇÕES PERSONALIZADAS ***
#

# Incluir configurações adicionais
include "conf.d/"

# ====================================================
# GUIA PASSO-A-PASSO PARA INSTALAÇÃO ACOMPANHADA:
# ====================================================
#
# PASSO 1: PREPARAÇÃO (5 minutos)
# ================================
# - Fazer backup da configuração atual
# - Verificar conectividade com servidor GLPI
# - Testar: curl -I "https://j2ksistemas.com.br/ativos/marketplace/glpiinventory/"
#
# PASSO 2: APLICAR CONFIGURAÇÃO (2 minutos)
# =========================================
# Linux/Unix:
#   sudo cp agent.cfg /etc/glpi-agent/agent.cfg
#   sudo chown glpi-agent:glpi-agent /etc/glpi-agent/agent.cfg
#
# Windows:
#   Importar configurações no Registry ou usar MSI
#
# PASSO 3: INICIAR MONITORAMENTO (1 minuto)
# =========================================
# Terminal 1 - Logs em tempo real:
#   sudo tail -f /var/log/glpi-agent.log
#
# Terminal 2 - Status do serviço:
#   sudo systemctl status glpi-agent
#
# Browser - Interface web:
#   http://localhost:62354
#
# PASSO 4: REINICIAR SERVIÇO (1 minuto)
# =====================================
# Linux/Unix:
#   sudo systemctl restart glpi-agent
#   sudo systemctl enable glpi-agent
#
# Windows:
#   net stop "GLPI Agent"
#   net start "GLPI Agent"
#
# PASSO 5: ACOMPANHAR PRIMEIRA EXECUÇÃO (15 minutos)
# ==================================================
# - Observar logs no Terminal 1
# - Verificar status na interface web
# - Aguardar primeira conexão com servidor
# - Confirmar envio de inventário
#
# PASSO 6: EXECUTAR INVENTÁRIO MANUAL (2 minutos)
# ===============================================
# Para acelerar teste (sem aguardar delay):
#   sudo glpi-agent --debug --force
#
# PASSO 7: VERIFICAR NO GLPI (3 minutos)
# ======================================
# - Acessar GLPI: https://j2ksistemas.com.br/ativos/
# - Ir em: Administração → GLPI Inventory → Agentes
# - Confirmar aparição do agente
# - Verificar: Ativos → Computadores
#
# PASSO 8: VALIDAR FUNCIONAMENTO (5 minutos)
# ==========================================
# - Verificar inventário completo foi enviado
# - Confirmar dados de hardware detectados
# - Testar descoberta de rede (se aplicável)
# - Validar logs sem erros críticos
#
# PASSO 9: OTIMIZAR CONFIGURAÇÃO (5 minutos)
# ==========================================
# Após confirmar funcionamento, ajustar:
# - debug = 1 (menos verboso)
# - delaytime = 3600 (intervalo normal)
# - full-inventory-postpone = 14 (inventário parcial)
# - scan-homedirs = 0 (se não necessário)
# - scan-profiles = 0 (se não necessário)
#
# PASSO 10: DOCUMENTAR E FINALIZAR (5 minutos)
# ============================================
# - Documentar configurações específicas
# - Criar backup da configuração final
# - Agendar monitoramento regular
# - Configurar alertas se necessário
#
# ====================================================
# COMANDOS ÚTEIS PARA ACOMPANHAMENTO:
# ====================================================
#
# Ver logs em tempo real:
# tail -f /var/log/glpi-agent.log
#
# Status do serviço:
# systemctl status glpi-agent
#
# Executar manualmente com debug:
# glpi-agent --debug --force
#
# Testar conectividade:
# glpi-agent --server=https://j2ksistemas.com.br/ativos/marketplace/glpiinventory/ --test
#
# Ver configuração ativa:
# glpi-agent --config
#
# Interface web local:
# http://localhost:62354
#
# ====================================================
# INDICADORES DE SUCESSO:
# ====================================================
#
# ✅ Nos logs: "task Inventory successfully executed"
# ✅ No GLPI: Agente aparece na lista
# ✅ No GLPI: Computador aparece em Ativos
# ✅ Interface web: Status "Connected"
# ✅ Sem erros de SSL ou conectividade
#
# ====================================================